<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Naaval Legal — CGU, CGV, confidentialité et mentions légales</title>
    <meta
      name="description"
      content="Conditions générales d’utilisation, conditions générales de vente, politique de confidentialité et mentions légales de Naaval."
    />
    <meta name="theme-color" content="#07131f" />
    <link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="legal-shell">
      <header class="legal-header">
        <a class="legal-brand" href="/">
          <img src="../assets/logo-mark.svg" alt="Naaval" class="legal-brand__mark" />
          <div class="legal-brand__copy">
            <strong>Naaval Legal</strong>
            <span>Documents contractuels et gouvernance de la plateforme</span>
          </div>
        </a>

        <div class="legal-header__actions">
          <a class="ghost-button" href="/">Retour à la landing</a>
          <a class="solid-button" href="mailto:hello@naaval.eu?subject=Naaval%20Legal">Contact</a>
        </div>
      </header>

      <main id="top" class="legal-main">
        <section id="legal-hero"></section>
        <div class="legal-layout">
          <aside id="legal-toc"></aside>
          <section id="legal-content" class="legal-content"></section>
        </div>
      </main>

      <button class="back-to-top hidden" id="back-to-top" type="button">Retour en haut</button>
    </div>

    <script src="./legal.js"></script>
  </body>
</html>
